<html lang="ko">
<head>

<title>Space Launcher</title>
<style>
  html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at center, #10142e 0%, #000 75%); color: #e6ebff; font-family: sans-serif; }

</style>
</head>
<body>
<main>
  <h1>🚀 Space Explorer</h1>
  <p>태양계와 그 사이를 나는 우주선을 Three.js로 만나보세요</p>
